name: bob
description: >-
  Instala o bob, roda bob check com os gates disponíveis (mutate incluso)
  e publica .bob/report.md num único comentário do pull request.

inputs:
  base:
    description: >-
      Ref do git diff (ex. origin/main). Vazio usa origin/$GITHUB_BASE_REF
      em pull requests; senão o bob.yaml.
    required: false
    default: ""
  gates:
    description: >-
      Gates separados por vírgula. O padrão do CI pede todos, inclusive
      mutate; gates ainda não implementados aparecem como não executados.
    required: false
    default: crap,dry,deps,mutate
  pip-spec:
    description: >-
      Requisito pip explícito. Vazio instala o checkout quando ele é
      bob-quality; caso contrário, o git da action.
    required: false
    default: ""
  token:
    description: Token para o comentário e para ler artefatos. Vazio usa o GITHUB_TOKEN do workflow.
    required: false
    default: ""
  language:
    description: >-
      Idioma da saída do bob e do comentário (en ou pt-BR). Vazio deixa
      BOB_LANG, language no bob.yaml e en decidirem, nesta ordem.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22.18.0"

    - name: Instalar bob
      shell: bash
      env:
        BOB_PIP_SPEC: ${{ inputs.pip-spec }}
        GITHUB_ACTION_REPOSITORY: ${{ github.action_repository }}
        GITHUB_ACTION_REF: ${{ github.action_ref }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"

    - name: Instalar jscpd 5.4.1
      shell: bash
      env:
        JSCPD_VERSION: "5.4.1"
      run: bash "$GITHUB_ACTION_PATH/install_jscpd.sh"

    - name: Restaurar cache de mutação
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
      run: python "$GITHUB_ACTION_PATH/restore_cache.py" || echo "cache de mutação não restaurado; o check segue"

    - name: bob check
      shell: bash
      env:
        BOB_BASE: ${{ inputs.base }}
        BOB_GATES: ${{ inputs.gates }}
        BOB_LANGUAGE: ${{ inputs.language }}
      run: bash "$GITHUB_ACTION_PATH/run_check.sh"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: bob-mutation-cache
        path: |
          .bob/mutation-cache.json
          .bob/stryker-incremental.json
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 7

    - name: Comentar relatório no PR
      if: always() && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        BOB_PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_API_URL: ${{ github.api_url }}
        BOB_LANGUAGE: ${{ inputs.language }}
      run: python "$GITHUB_ACTION_PATH/upsert_comment.py"

    - name: Propagar exit code do bob
      if: always()
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/propagate_exit.sh"
