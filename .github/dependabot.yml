version: 2
updates:
  # The lockfile must not be regenerated from scratch.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: eslint-plugin-sonarjs
        update-types:
          - "version-update:semver-major"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    groups:
      website:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/bob"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
