name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release, igual a v + versão do pyproject.toml (ex.: v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Publicar como pré-release (não vira a latest)"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Só gerar e verificar os 3 assets como artefato do run, sem tag nem release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      wheel: ${{ steps.meta.outputs.wheel }}
    steps:
      - name: Só na main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "release: rode na main (ref: $REF)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag igual à versão do pyproject.toml
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release: tag inválida: $TAG" >&2
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "release: tag $TAG diferente de v$VERSION (pyproject.toml)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "wheel=bob_quality-$VERSION-py3-none-any.whl" >> "$GITHUB_OUTPUT"
      - name: Tag ainda não existe
        env:
          TAG: ${{ inputs.tag }}
        run: |
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "release: a tag $TAG já existe" >&2
            exit 1
          fi
          if [ "$rc" -ne 2 ]; then
            echo "release: falha ao consultar as tags (rc $rc)" >&2
            exit 1
          fi
      - name: Gerar os 3 assets
        env:
          WHEEL: ${{ steps.meta.outputs.wheel }}
        run: |
          python -m pip install 'build==1.6.1' 'twine==7.0.0'
          python -m build --wheel --outdir dist
          twine check --strict dist/*
          cp scripts/install.sh dist/install.sh
          cd dist
          sha256sum install.sh "$WHEEL" | LC_ALL=C sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(ls | LC_ALL=C sort | tr '\n' ' ')" = "SHA256SUMS $WHEEL install.sh "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  verify:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            gitleaks: linux_x64
            gitleaks_sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            gitleaks: linux_arm64
            gitleaks_sha256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
          - platform: macos-x64
            runner: macos-15-intel
            gitleaks: darwin_x64
            gitleaks_sha256: dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709
          - platform: macos-arm64
            runner: macos-15
            gitleaks: darwin_arm64
            gitleaks_sha256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - name: Conferir os assets do run
        working-directory: ${{ runner.temp }}/assets
        run: |
          shasum -a 256 -c SHA256SUMS
          cmp install.sh "$GITHUB_WORKSPACE/scripts/install.sh"
      - name: gitleaks 8.30.1
        env:
          GL_FILE: gitleaks_8.30.1_${{ matrix.gitleaks }}.tar.gz
          GL_SHA256: ${{ matrix.gitleaks_sha256 }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$GL_FILE"
          printf '%s  %s\n' "$GL_SHA256" "$GL_FILE" | shasum -a 256 -c
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$GL_FILE" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Ambiente de desenvolvimento
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
        run: |
          python3 -m venv /tmp/dev
          /tmp/dev/bin/pip install -e '.[dev]' 'uv==0.13.0'
          echo "/tmp/dev/bin" >> "$GITHUB_PATH"
      - run: /tmp/dev/bin/bob doctor
      - run: /tmp/dev/bin/pytest
      - name: Comando de Verificação (harness)
        env:
          TMPDIR: ${{ runner.temp }}
          VERIFY_DIST: ${{ runner.temp }}/assets
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
        run: sh scripts/verify-install.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-install-tmp-${{ matrix.platform }}
          path: ${{ runner.temp }}/bob-verify.*
          if-no-files-found: ignore

  publish:
    needs: [check, verify]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          WHEEL: ${{ needs.check.outputs.wheel }}
          PRERELEASE: ${{ inputs.prerelease }}
          ASSETS: ${{ runner.temp }}/assets
        run: |
          notes="docs/release-checks/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "release: falta $notes" >&2
            exit 1
          fi
          set -- "$TAG" "$ASSETS/install.sh" "$ASSETS/$WHEEL" "$ASSETS/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$notes"
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease --latest=false
          else
            set -- "$@" --latest
          fi
          gh release create "$@"
