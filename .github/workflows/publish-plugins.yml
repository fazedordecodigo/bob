name: publish-plugins

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate only. The job has no upload either way.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cursor:
    name: cursor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Record that this job does not upload
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          echo "dry_run=${DRY_RUN}"
          echo "Cursor marketplace publication is manual. This job does not upload."

      - name: Validate the Cursor plugin
        env:
          TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          args=(--root "$GITHUB_WORKSPACE")
          if [ -n "${TAG}" ]; then
            args+=(--tag "$TAG")
          fi
          python scripts/validate_cursor_plugin.py "${args[@]}"
