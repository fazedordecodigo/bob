name: pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, branch, or tag to build. Empty uses the workflow ref.
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One deploy at a time. An in-progress deploy is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the docs site
        working-directory: website
        run: |
          npm ci
          npm run build
          npm test
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Enabling Pages needs a token other than GITHUB_TOKEN. Leave this false.
          enablement: false
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Health check
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "deployed ${PAGE_URL}"
          urls=(
            "https://fazedordecodigo.github.io/bob/"
            "https://fazedordecodigo.github.io/bob/pt-BR/"
          )
          attempts=10
          pause=10
          for url in "${urls[@]}"; do
            code=""
            for attempt in $(seq 1 "$attempts"); do
              code="$(curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' --max-time 20 "$url" || true)"
              echo "${url} attempt ${attempt}/${attempts}: HTTP ${code}"
              if [ "$code" = "200" ]; then
                break
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$pause"
              fi
            done
            if [ "$code" != "200" ]; then
              echo "health check failed: ${url} returned HTTP ${code}, expected 200" >&2
              exit 1
            fi
          done
