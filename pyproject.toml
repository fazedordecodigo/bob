[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bob-quality"
version = "0.1.0"
description = "Quality gates (CRAP, DRY, mutation, dependencies) for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emerson Delatorre" }]
dependencies = [
    "lizard==1.24.1",
    "coverage==7.16.2",
    "PyYAML==6.0.3",
    "mutmut==3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "jsonschema==4.26.0",
]

[project.scripts]
bob = "bob_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bob_quality = ["schemas/*.json", "hooks/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
norecursedirs = ["fixtures", ".bob", ".git"]

[tool.mutmut]
source_paths = ["src"]
also_copy = [
    "docs",
    "skills",
    "js",
    "tests/fixtures",
    ".github",
    "package.json",
    "package-lock.json",
    "AGENTS.md",
]
